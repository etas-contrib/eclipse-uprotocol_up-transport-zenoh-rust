[package]
description = "Zenoh Rust Transport library implementation of the Eclipse uProtocol"
edition = "2021"
include = ["/src/*", "/examples/*", "/Cargo.toml", "/README.md", "/config/*"]
keywords = ["uProtocol", "SDK", "communication", "Zenoh"]
license = "Apache-2.0"
name = "up-transport-zenoh"
readme = "README.md"
repository = "https://github.com/eclipse-uprotocol/up-transport-zenoh-rust"
rust-version = "1.85"
version = "0.9.0"
resolver = "3"

[lints.clippy]
all = "deny"
pedantic = "deny"
#cargo = "deny"
#restriction = "deny"
#nursery = "deny"

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.91"
bytes = "1.12.1"
protobuf = { version = "3.7.2" }
# addresses https://rustsec.org/advisories/RUSTSEC-2026-0185.html
quinn-proto = { version = "0.11.15" }
tokio = { version = "1.53.1", default-features = false }
tracing = "0.1.44"
up-rust = { version = "0.9", default-features = false }
# [impl->dsn~up-transport-zenoh-protocol-version~1]
zenoh = { version = "1.9.0" }

[dev-dependencies]
chrono = "0.4.45"
clap = { version = "4.6.6", features = ["derive"] }
quinn-proto = { version = "0.11.15" }
serde_json = "1.0.151"
serial_test = { version = "3.5.0" }
test-case = { version = "3.3" }
tokio = { version = "1.53.1", default-features = false, features = ["rt-multi-thread", "signal"] }
tracing-subscriber = "0.3.23"
up-rust = { version = "0.9", features = ["communication", "test-util"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1

[package.metadata.docs.rs]
all-features = true
